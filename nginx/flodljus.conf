# Flodljus Manager: spelet (statiska filer) + molnsparningen (/api/ → flodljus-api).
# Spelet och API:et delar adress, så ingen CORS behövs.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Molnsparning
    location /api/ {
        proxy_pass http://flodljus-api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 8m;
        proxy_read_timeout 30s;
    }

    # Spelet: hämta alltid senaste versionen av sidan och skripten efter en uppdatering
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json;
}
